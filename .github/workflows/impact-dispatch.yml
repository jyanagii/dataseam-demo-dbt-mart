# Generated by dataseam scaffold ci --impact.
# Copy to dbt repository for 'acme_mart' (protected default branch).
# Set LINEAGE_SITE_REPOSITORY and the LINEAGE_DISPATCH_TOKEN secret.
# Uses workflow_run so PR code cannot read LINEAGE_DISPATCH_TOKEN.

name: Dispatch impact check
'on':
  workflow_run:
    workflows:
    - Impact compile (PR)
    types:
    - completed
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  dispatch:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion
      == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
    - name: Download unprivileged PR manifest artifact
      uses: actions/download-artifact@v5.0.0
      with:
        name: pr-manifest-acme_mart
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: pr-artifact
    - name: Resolve PR number from head SHA and verify repository
      id: resolve
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        REPO: ${{ github.repository }}
      run: |
        python - <<'PY'
        import json, os, sys, urllib.request
        repo = os.environ['REPO']
        sha = os.environ['HEAD_SHA']
        req = urllib.request.Request(
            f"{os.environ['GITHUB_API_URL']}/repos/{repo}/commits/{sha}/pulls",
            headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                     'Accept': 'application/vnd.github+json'},
        )
        with urllib.request.urlopen(req, timeout=30) as resp:
            pulls = json.loads(resp.read().decode())
        pr = next((p['number'] for p in pulls if p.get('state') == 'open'
                   and (p.get('head') or {}).get('sha') == sha
                   and ((p.get('head') or {}).get('repo') or {}).get('full_name') == repo), None)
        if pr is None:
            sys.exit('no open PR from this repository matches head_sha')
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
            out.write(f'pr_number={pr}\n')
        PY
    - name: Dispatch impact check in lineage-site
      if: ${{ vars.LINEAGE_SITE_REPOSITORY != '' }}
      env:
        LINEAGE_SITE_REPOSITORY: ${{ vars.LINEAGE_SITE_REPOSITORY }}
        LINEAGE_SITE_REF: ${{ vars.LINEAGE_SITE_REF || 'main' }}
        LINEAGE_DISPATCH_TOKEN: ${{ secrets.LINEAGE_DISPATCH_TOKEN }}
        PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        SOURCE_REPO: ${{ github.repository }}
        SOURCE_KIND: dbt
        SOURCE_PROJECT: acme_mart
      run: |
        python - > dispatch.json <<'PY'
        import json, os
        print(json.dumps({
            'ref': os.environ['LINEAGE_SITE_REF'],
            'inputs': {
                'source_repo': os.environ['SOURCE_REPO'],
                'source_project': os.environ['SOURCE_PROJECT'],
                'source_kind': os.environ['SOURCE_KIND'],
                'pr_number': os.environ['PR_NUMBER'],
                'head_sha': os.environ['HEAD_SHA'],
                'run_id': os.environ['RUN_ID'],
            },
        }))
        PY
        curl --fail-with-body --silent --show-error --request POST \
          --header "Authorization: Bearer $LINEAGE_DISPATCH_TOKEN" \
          --header "Accept: application/vnd.github+json" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          --data @dispatch.json \
          "$GITHUB_API_URL/repos/$LINEAGE_SITE_REPOSITORY/actions/workflows/impact-check.yml/dispatches"
