# Generated by dataseam scaffold ci --impact.
# Copy to dbt repository for 'acme_mart'.
# Set DATASEAM_DBT_DATABASE and DATASEAM_DBT_SCHEMA unless profile_overrides has them.
# Set DATASEAM_DBT_TARGET if the production dbt target is not named prod.
# Runs with zero secrets and checks out pull_request.head.sha explicitly.

name: Impact compile (PR)
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
permissions: {}
concurrency:
  group: dataseam-impact-compile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  DATASEAM_INSTALL_TOKEN: ${{ secrets.LINEAGE_DISPATCH_TOKEN }}
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.12'
    - name: Compile dbt offline without credentials
      env:
        DATASEAM_DBT_TARGET: ${{ vars.DATASEAM_DBT_TARGET || 'prod' }}
        DATASEAM_DBT_DATABASE: acme-analytics-prod
        DATASEAM_DBT_SCHEMA: mart
      run: |
        python -m pip install 'dbt-core~=1.10.0' 'dbt-bigquery~=1.10.0'
        if [ -n "${DATASEAM_INSTALL_TOKEN:-}" ]; then
          git config --global url."https://x-access-token:${DATASEAM_INSTALL_TOKEN}@github.com/jyanagii/dataseam".insteadOf "https://github.com/jyanagii/dataseam"
        fi
        python -m pip install 'dataseam @ git+https://github.com/jyanagii/dataseam.git@8b58901d408be32d5d55fc55914a119e163c2afe'
        dataseam impact-compile . -o target/pr-compile --platform bigquery --force-incremental --target-name "$DATASEAM_DBT_TARGET" --profile-override "database=$DATASEAM_DBT_DATABASE" --profile-override "schema=$DATASEAM_DBT_SCHEMA"
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: pr-manifest-acme_mart
        path: target/pr-compile/manifest.json
        retention-days: 1
        if-no-files-found: error
